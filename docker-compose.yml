services:
  db:
    image: postgres:16-alpine
    container_name: fxcryptoedge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fxcryptoedge
      POSTGRES_PASSWORD: fxcryptoedge
      POSTGRES_DB: fxcryptoedge
    ports:
      - "5432:5432"
    volumes:
      - fxcryptoedge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxcryptoedge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fxcryptoedge_pgdata:
